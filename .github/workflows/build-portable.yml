name: Build Portable

on:
  push:
    branches:
      - build-portable
    paths:
      - '.github/workflows/build-portable.yml'
      - 'app/**'
      - 'script/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# Lean CI: only build Windows portable app folder (no installers, no nested zip).
env:
  NODE_VERSION: '24.22.1'

jobs:
  portable-windows:
    name: Windows ${{ matrix.arch }} portable
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}

      - name: Build production app
        run: npm run build:prod
        env:
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET: ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}

      - name: Verify unpacked app
        shell: pwsh
        run: |
          $src = "dist\GitHubDesktop-win32-${{ matrix.arch }}"
          if (-not (Test-Path $src)) {
            Write-Host 'dist contents:'
            Get-ChildItem -Path dist -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw "Unpacked app directory not found: $src"
          }
          Write-Host "Contents of $src (first 25):"
          Get-ChildItem $src | Select-Object -First 25 | Format-Table Name, Length
          $exe = Join-Path $src 'GitHubDesktop.exe'
          if (-not (Test-Path $exe)) {
            throw "GitHubDesktop.exe not found in $src"
          }
          Write-Host "OK: $exe"

      # Upload the app directory itself. GitHub packs it once on download,
      # so the user gets a single zip with GitHubDesktop.exe at the top level.
      - name: Upload portable app
        uses: actions/upload-artifact@v7
        with:
          name: GitHubDesktop-portable-${{ matrix.arch }}
          path: dist/GitHubDesktop-win32-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14
